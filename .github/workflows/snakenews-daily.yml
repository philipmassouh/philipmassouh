name: SnakeNews Daily

on:
  schedule:
    - cron: "0 15 * * *"  # 7am Pacific (8am during daylight time)
  workflow_dispatch:

concurrency:
  group: snakenews-daily
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: snakenews/requirements.txt

      - run: pip install -r snakenews/requirements.txt

      - name: Find, rewrite and narrate today's stories
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python snakenews/daily.py

      - name: Commit new stories
        id: commit
        run: |
          git add snakenews
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "SnakeNews Desk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SnakeNews for $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: news
    if: needs.news.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
