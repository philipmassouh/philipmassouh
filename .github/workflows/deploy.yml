name: Deploy to Web Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H philipmassouh.com >> ~/.ssh/known_hosts

      # This key can only run site-deploy on the server (see deploy/bootstrap.sh).
      - name: Pull and deploy
        run: ssh deploy@philipmassouh.com
