<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Philip's Spots</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
        <link rel="stylesheet" href="style.css?v=print-2" />
    </head>
    <body>
        <div id="map"></div>
        <div id="table-view"></div>
        <header id="site-header">
            <h1 id="wordmark"><a href="/">Philip's Spots</a></h1>
            <nav id="map-controls" aria-label="Map controls">
                <button type="button" class="bar-btn" id="toggle-table" aria-pressed="false">Table</button>
                <button type="button" class="bar-btn" id="toggle-tooltips" aria-pressed="false">Names</button>
                <div class="map-filter" role="group" aria-label="Show">
                    <button type="button" class="bar-btn" id="filter-been">Been</button>
                    <button type="button" class="bar-btn" id="filter-try">Try</button>
                    <button type="button" class="bar-btn" id="filter-both">Both</button>
                </div>
            </nav>
        </header>
        <dialog id="modal" aria-labelledby="modal-title"></dialog>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="utils.js?v=print-1"></script>
        <script src="main.js?v=print-2"></script>
    </body>
</html>
