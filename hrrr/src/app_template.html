<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HRRR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --rule: 2px solid var(--ink);
    --font: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --h: 40px;
  }
  *, *::before, *::after { box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font: 700 12px/1.2 var(--font);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--paper);
  }
  button, select, input { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .row { display: flex; align-items: stretch; min-height: var(--h); }
  .cell {
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-right: var(--rule);
    white-space: nowrap;
    background: var(--paper);
  }
  button.cell, select.cell { border-top: 0; border-bottom: 0; border-left: 0; cursor: pointer; }
  button.cell:hover, select.cell:hover { text-decoration: underline; text-underline-offset: 3px; }
  .cell.on { color: var(--paper); background: var(--ink); }
  select.cell { appearance: none; -webkit-appearance: none; }

  header { border-bottom: var(--rule); }
  header .row { overflow-x: auto; scrollbar-width: none; }
  header .row::-webkit-scrollbar { display: none; }
  #wordmark { margin: 0; font-size: 14px; color: var(--paper); background: var(--ink); }
  #more { max-width: 260px; text-overflow: ellipsis; }

  #map { flex: 1; min-height: 0; background: var(--ink); }
  .leaflet-container { font: inherit; }
  .leaflet-control-zoom.leaflet-bar { border: var(--rule); box-shadow: none; }
  .leaflet-bar a, .leaflet-bar a:hover {
    width: 34px; height: 34px; line-height: 32px;
    color: var(--ink); background: var(--paper);
    border-bottom: var(--rule); border-radius: 0 !important;
    font: 700 18px/32px var(--font);
  }
  .leaflet-bar a:last-child { border-bottom: 0; }
  .leaflet-bar a:hover { color: var(--paper); background: var(--ink); }

  footer { border-top: var(--rule); }
  #legendRow { border-bottom: var(--rule); }
  #legendTitle { flex: none; }
  #legendCell { flex: 1; min-width: 0; padding: 6px 12px; }
  #legend { display: block; width: 100%; height: 26px; }
  #readout { flex: none; width: 28ch; overflow: hidden; justify-content: flex-end; border-right: 0; font-variant-numeric: tabular-nums; }
  #play { width: 64px; justify-content: center; }
  .step { width: 40px; justify-content: center; font-size: 14px; }
  #fhrLabel { width: 56px; justify-content: center; font-variant-numeric: tabular-nums; }
  #sliderCell { flex: 1; min-width: 80px; }
  #fhr { width: 100%; height: 24px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; cursor: pointer; }
  #fhr::-webkit-slider-runnable-track { height: 2px; background: var(--ink); }
  #fhr::-moz-range-track { height: 2px; background: var(--ink); }
  #fhr::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 22px; margin-top: -10px; background: var(--ink); border: 0; }
  #fhr::-moz-range-thumb { width: 10px; height: 22px; background: var(--ink); border: 0; border-radius: 0; }
  #validTime { flex: none; width: 21ch; justify-content: center; font-variant-numeric: tabular-nums; }
  #run { border-right: 0; }
  /* Floats over the map so loading never shifts the bars. */
  #status {
    position: fixed;
    top: calc(var(--h) + 2px + 12px);
    left: 12px;
    z-index: 1000;
    min-height: 32px;
    border: 2px solid var(--paper);
    color: var(--paper);
    background: var(--ink);
    pointer-events: none;
  }
  #status:empty { display: none; }

  @media (max-width: 760px) {
    #legendRow { flex-wrap: wrap; }
    #legendCell { order: 3; flex: 1 1 100%; border-top: var(--rule); border-right: 0; }
    #legendTitle { flex: 1; }
    #readout { width: auto; flex: 1; }
    #controls { flex-wrap: wrap; }
    #sliderCell { flex: 1 1 100%; order: 5; border-top: var(--rule); border-right: 0; min-height: var(--h); }
    #validTime { flex: 1; width: auto; border-right: 0; }
    #run { flex: 1 1 100%; order: 6; border-top: var(--rule); }
  }
</style>
</head>
<body>
<header>
  <nav class="row" id="fields" aria-label="Fields">
    <h1 class="cell" id="wordmark">HRRR</h1>
    <label class="sr-only" for="more">More fields</label>
    <select class="cell" id="more"></select>
  </nav>
</header>

<div id="map" aria-label="HRRR forecast map"></div>

<footer>
  <div class="row" id="legendRow">
    <div class="cell" id="legendTitle"></div>
    <div class="cell" id="legendCell"><canvas id="legend"></canvas></div>
    <div class="cell" id="readout">&nbsp;</div>
  </div>
  <div class="row" id="controls">
    <button type="button" class="cell" id="play">Play</button>
    <button type="button" class="cell step" id="prev" aria-label="Previous hour">&lsaquo;</button>
    <div class="cell" id="fhrLabel">F01</div>
    <button type="button" class="cell step" id="next" aria-label="Next hour">&rsaquo;</button>
    <div class="cell" id="sliderCell">
      <label class="sr-only" for="fhr">Forecast hour</label>
      <input type="range" id="fhr" min="0" max="18" step="1" value="1">
    </div>
    <div class="cell" id="validTime"></div>
    <div class="cell" id="status">Starting</div>
    <label class="sr-only" for="run">Model run</label>
    <select class="cell" id="run"></select>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

<script>
"use strict";
// Delta-encoded (x100) US state outlines, [ [dx0,dy0,dx1,dy1,...], ... ]
const STATE_LINES_ENC = /*__STATES__*/;

const BUCKET = "https://noaa-hrrr-bdp-pds.s3.amazonaws.com";
const TERRAIN = "https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png";

// ---------- curated fields ----------
// src picks a GRIB message by variable, level, and time window:
// "inst" = instantaneous, "1h" = the past hour, "run" = since the run started.
const K2F = (v) => (v - 273.15) * 1.8 + 32;
const MS2MPH = (v) => v * 2.23694;
const WIND_STOPS = (k) => [
  [0, 255, 255, 255, 0], [5 * k, 210, 230, 250, 255], [10 * k, 140, 200, 240, 255],
  [15 * k, 80, 180, 120, 255], [20 * k, 170, 210, 60, 255], [25 * k, 250, 220, 60, 255],
  [30 * k, 250, 150, 40, 255], [40 * k, 230, 60, 40, 255], [50 * k, 180, 0, 80, 255],
  [60 * k, 140, 0, 160, 255], [80 * k, 255, 160, 255, 255],
];
const CURATED = [
  {
    id: "temp", short: "Temp", label: "Temperature", units: "°F",
    src: { var: "TMP", level: "2 m above ground" }, convert: K2F,
    stops: [
      [-30, 120, 0, 130, 255], [-10, 170, 110, 220, 255], [10, 60, 80, 200, 255],
      [25, 70, 160, 230, 255], [32, 190, 230, 250, 255], [40, 120, 200, 150, 255],
      [50, 60, 170, 80, 255], [60, 170, 210, 60, 255], [70, 250, 230, 70, 255],
      [80, 250, 170, 40, 255], [90, 230, 90, 30, 255], [100, 190, 20, 30, 255],
      [110, 120, 0, 40, 255], [120, 230, 130, 200, 255],
    ],
  },
  {
    id: "dewpt", short: "Dew", label: "Dewpoint", units: "°F",
    src: { var: "DPT", level: "2 m above ground" }, convert: K2F,
    stops: [
      [-10, 110, 80, 50, 255], [20, 165, 125, 85, 255], [35, 215, 195, 160, 255],
      [45, 190, 225, 170, 255], [55, 100, 200, 100, 255], [65, 20, 150, 60, 255],
      [70, 0, 110, 90, 255], [75, 0, 80, 140, 255], [80, 80, 0, 140, 255],
    ],
  },
  {
    id: "wind", short: "Wind", label: "Wind", units: "mph",
    components: [
      { var: "UGRD", level: "10 m above ground" },
      { var: "VGRD", level: "10 m above ground" },
    ],
    combine: (u, v) => MS2MPH(Math.hypot(u, v)),
    stops: WIND_STOPS(1),
  },
  {
    id: "gust", short: "Gust", label: "Wind gust", units: "mph",
    src: { var: "GUST", level: "surface" }, convert: MS2MPH,
    stops: WIND_STOPS(1.5),
  },
  {
    id: "radar", short: "Radar", label: "Radar", units: "dBZ",
    src: { var: "REFC", level: "entire atmosphere" },
    stops: [
      [5, 4, 233, 231, 0], [10, 4, 233, 231, 200], [15, 1, 100, 250, 220],
      [20, 2, 220, 30, 235], [25, 1, 180, 10, 245], [30, 0, 130, 0, 255],
      [35, 253, 248, 2, 255], [40, 229, 188, 0, 255], [45, 253, 149, 0, 255],
      [50, 253, 0, 0, 255], [55, 200, 0, 0, 255], [60, 160, 0, 0, 255],
      [65, 248, 0, 253, 255], [70, 170, 90, 210, 255], [75, 255, 255, 255, 255],
    ],
  },
  {
    id: "precip", short: "Precip", label: "Precip, past hour", units: "in",
    src: { var: "APCP", level: "surface", kind: "acc", win: "1h" }, convert: (v) => v / 25.4,
    stops: [
      [0.01, 200, 240, 190, 255], [0.05, 120, 210, 120, 255], [0.1, 40, 160, 60, 255],
      [0.25, 30, 110, 200, 255], [0.5, 120, 70, 200, 255], [0.75, 200, 40, 180, 255],
      [1, 230, 30, 30, 255], [1.5, 250, 140, 40, 255], [2, 250, 230, 80, 255],
      [3, 255, 255, 255, 255],
    ],
  },
  {
    id: "snow", short: "Snow", label: "Snowfall, run total", units: "in",
    src: { var: "ASNOW", level: "surface", kind: "acc", win: "run" }, convert: (v) => v * 39.3701,
    stops: [
      [0.1, 200, 220, 250, 255], [1, 140, 180, 240, 255], [3, 80, 130, 220, 255],
      [6, 40, 70, 180, 255], [12, 120, 60, 190, 255], [18, 190, 60, 190, 255],
      [24, 240, 120, 220, 255], [36, 255, 220, 250, 255],
    ],
  },
  {
    id: "cloud", short: "Cloud", label: "Cloud cover", units: "%",
    src: { var: "TCDC", level: "entire atmosphere" },
    stops: [[10, 255, 255, 255, 0], [40, 230, 230, 230, 120], [80, 200, 200, 200, 210], [100, 170, 170, 170, 235]],
  },
  {
    id: "mslp", short: "Pres", label: "Sea-level pressure", units: "mb",
    src: { var: "MSLMA", level: "mean sea level" }, convert: (v) => v / 100,
    stops: [
      [975, 120, 0, 130, 255], [990, 90, 90, 220, 255], [1000, 90, 170, 230, 255],
      [1008, 200, 235, 240, 255], [1013, 245, 245, 245, 255], [1018, 250, 220, 150, 255],
      [1025, 240, 150, 60, 255], [1035, 200, 50, 40, 255], [1045, 130, 0, 40, 255],
    ],
  },
  {
    id: "cape", short: "CAPE", label: "Surface CAPE", units: "J/kg",
    src: { var: "CAPE", level: "surface" },
    stops: [
      [100, 40, 90, 180, 0], [500, 60, 140, 230, 170], [1000, 0, 200, 140, 220],
      [2000, 240, 230, 60, 255], [3000, 255, 140, 0, 255], [4000, 255, 40, 0, 255],
      [5000, 255, 0, 170, 255], [6000, 120, 0, 120, 255],
    ],
  },
];

// ---------- names for the full field list ----------
const NAMES = {
  REFC: ["Composite reflectivity", "dBZ"], REFD: ["Reflectivity", "dBZ"], RETOP: ["Echo top", "m"],
  VIL: ["Vertically integrated liquid", "kg/m²"], VIS: ["Visibility", "m"], GUST: ["Wind gust", "m/s"],
  UGRD: ["U wind", "m/s"], VGRD: ["V wind", "m/s"], WIND: ["Wind speed", "m/s"],
  MAXUW: ["Max U wind", "m/s"], MAXVW: ["Max V wind", "m/s"], HGT: ["Height", "m"],
  TMP: ["Temperature", "K"], DPT: ["Dewpoint", "K"], POT: ["Potential temperature", "K"],
  SPFH: ["Specific humidity", "kg/kg"], RH: ["Relative humidity", "%"], DZDT: ["Vertical velocity", "m/s"],
  MAXUVV: ["Max updraft", "m/s"], MAXDVV: ["Max downdraft", "m/s"], MSLMA: ["Sea-level pressure", "Pa"],
  MAXREF: ["Max reflectivity", "dBZ"], MXUPHL: ["Max updraft helicity", "m²/s²"],
  MNUPHL: ["Min updraft helicity", "m²/s²"], RELV: ["Relative vorticity", "1/s"],
  HAIL: ["Max hail size", "m"], TCOLG: ["Column graupel", "kg/m²"], LTNGSD: ["Lightning strike density", ""],
  LTNG: ["Lightning threat", ""], PRES: ["Pressure", "Pa"], ASNOW: ["Snowfall", "m"],
  MSTAV: ["Soil moisture availability", "%"], CNWAT: ["Canopy water", "kg/m²"],
  WEASD: ["Snow water equivalent", "kg/m²"], SNOWC: ["Snow cover", "%"], SNOD: ["Snow depth", "m"],
  MASSDEN: ["Smoke concentration", "kg/m³"], CPOFP: ["Frozen precip share", "%"],
  PRATE: ["Precip rate", "kg/m²/s"], APCP: ["Precipitation", "kg/m²"], FROZR: ["Frozen precip", "kg/m²"],
  FRZR: ["Freezing rain", "kg/m²"], SSRUN: ["Surface runoff", "kg/m²"], BGRUN: ["Subsurface runoff", "kg/m²"],
  CSNOW: ["Snow yes/no", ""], CICEP: ["Ice pellets yes/no", ""], CFRZR: ["Freezing rain yes/no", ""],
  CRAIN: ["Rain yes/no", ""], SFCR: ["Surface roughness", "m"], FRICV: ["Friction velocity", "m/s"],
  SHTFL: ["Sensible heat flux", "W/m²"], LHTFL: ["Latent heat flux", "W/m²"], VEG: ["Vegetation", "%"],
  VEGMIN: ["Min vegetation", "%"], VEGMAX: ["Max vegetation", "%"], LAI: ["Leaf area index", ""],
  GFLUX: ["Ground heat flux", "W/m²"], VGTYP: ["Vegetation type", ""], LFTX: ["Lifted index", "K"],
  "4LFTX": ["Best lifted index", "K"], CAPE: ["CAPE", "J/kg"], CIN: ["CIN", "J/kg"],
  PWAT: ["Precipitable water", "kg/m²"], AOTK: ["Aerosol optical depth", ""], COLMD: ["Column smoke", "kg/m²"],
  TCOLW: ["Column cloud water", "kg/m²"], TCOLI: ["Column cloud ice", "kg/m²"], TCDC: ["Cloud cover", "%"],
  LCDC: ["Low cloud cover", "%"], MCDC: ["Mid cloud cover", "%"], HCDC: ["High cloud cover", "%"],
  ULWRF: ["Outgoing longwave", "W/m²"], DSWRF: ["Incoming sunlight", "W/m²"], DLWRF: ["Incoming longwave", "W/m²"],
  USWRF: ["Reflected sunlight", "W/m²"], CFNSF: ["Cloud forcing, solar", "W/m²"],
  VBDSF: ["Direct visible sunlight", "W/m²"], VDDSF: ["Diffuse visible sunlight", "W/m²"],
  HLCY: ["Storm-relative helicity", "m²/s²"], USTM: ["Storm motion U", "m/s"], VSTM: ["Storm motion V", "m/s"],
  VUCSH: ["U wind shear", "1/s"], VVCSH: ["V wind shear", "1/s"], HPBL: ["Boundary layer height", "m"],
  PLPL: ["Lifted parcel pressure", "Pa"], EFHL: ["Effective helicity", ""], CANGLE: ["Critical angle", "°"],
  LAYTH: ["Layer thickness", "m"], ESP: ["Enhanced stretching potential", ""], RHPW: ["Column relative humidity", "%"],
  LAND: ["Land", ""], ICEC: ["Sea ice", ""], SBT123: ["Satellite IR 12.3", "K"], SBT124: ["Satellite IR 12.4", "K"],
  SBT113: ["Satellite IR 11.3", "K"], SBT114: ["Satellite IR 11.4", "K"],
};

// First matching group wins, so topical groups come before the level-based ones.
const GROUPS = [
  ["Storms & radar", (v) => ["REFC", "REFD", "RETOP", "VIL", "MAXREF", "MXUPHL", "MNUPHL", "RELV", "HAIL", "TCOLG", "LTNG", "LTNGSD", "MAXUVV", "MAXDVV"].includes(v)],
  ["Precip & snow", (v) => ["APCP", "PRATE", "ASNOW", "WEASD", "SNOD", "SNOWC", "FROZR", "FRZR", "CSNOW", "CICEP", "CFRZR", "CRAIN", "CPOFP"].includes(v)],
  ["Instability & shear", (v) => ["CAPE", "CIN", "LFTX", "4LFTX", "HLCY", "USTM", "VSTM", "VUCSH", "VVCSH", "EFHL", "CANGLE", "ESP", "PLPL", "HPBL"].includes(v)],
  ["Clouds & radiation", (v, l) => /CDC$|^SBT|WRF$|SF$|^VIS$/.test(v) || /cloud/.test(l)],
  ["Surface", (v, l) => /^(surface|mean sea level|\d+ m above ground|0 m underground)$/.test(l)],
  ["Upper air", (v, l) => / mb$/.test(l)],
  ["Other", () => true],
];
function groupOf(v, l) {
  return GROUPS.find(([, test]) => test(v, l))[0];
}

const KIND_WORDS = { acc: "total", max: "max", min: "min", ave: "avg" };
const VIRIDIS = [[0, 68, 1, 84], [0.25, 59, 82, 139], [0.5, 33, 145, 140], [0.75, 94, 201, 98], [1, 253, 231, 37]];

// ---------- Lambert conformal projection (sphere, NCEP HRRR navigation) ----------
const EARTH_R = 6371229;
function makeProjection(grid) {
  const d2r = Math.PI / 180;
  const lat1 = grid.latin1 * d2r;
  const n = Math.sin(lat1);
  const F = Math.cos(lat1) * Math.pow(Math.tan(Math.PI / 4 + lat1 / 2), n) / n;
  const rho = (lat) => EARTH_R * F / Math.pow(Math.tan(Math.PI / 4 + lat / 2), n);
  const rho0 = rho(grid.lad * d2r);
  const lov = grid.lov > 180 ? grid.lov - 360 : grid.lov;
  const fwd = (lon, lat) => { // degrees -> metres
    let dl = lon - lov;
    if (dl > 180) dl -= 360;
    if (dl < -180) dl += 360;
    const r = rho(lat * d2r);
    const th = n * dl * d2r;
    return [r * Math.sin(th), rho0 - r * Math.cos(th)];
  };
  const [x0, y0] = fwd(grid.lo1, grid.la1);
  const dx = grid.dx * 1000, dy = grid.dy * 1000; // decoder stores km
  return {
    toGrid(lon, lat) { // -> fractional grid indices (i east, j north-from-south)
      const [x, y] = fwd(lon, lat);
      return [(x - x0) / dx, (y - y0) / dy];
    },
    toLonLat(i, j) {
      const x = x0 + i * dx, y = y0 + j * dy;
      const r = Math.hypot(x, rho0 - y);
      const th = Math.atan2(x, rho0 - y);
      let lon = lov + (th / n) / d2r;
      if (lon > 180) lon -= 360;
      const lat = (2 * Math.atan(Math.pow(EARTH_R * F / r, 1 / n)) - Math.PI / 2) / d2r;
      return [lon, lat];
    },
  };
}

// ---------- colour ----------
function makeColorLUT(stops, vmin, vmax, size) {
  const lut = new Uint8ClampedArray(size * 4);
  for (let k = 0; k < size; k++) {
    const v = vmin + (k / (size - 1)) * (vmax - vmin);
    let s = 0;
    while (s < stops.length - 1 && v > stops[s + 1][0]) s++;
    const a = stops[s], b = stops[Math.min(s + 1, stops.length - 1)];
    const t = b[0] === a[0] ? 0 : Math.min(1, Math.max(0, (v - a[0]) / (b[0] - a[0])));
    for (let c = 0; c < 4; c++) lut[k * 4 + c] = a[c + 1] + t * (b[c + 1] - a[c + 1]);
  }
  return lut;
}

// Colour range for fields without a hand-tuned colormap.
function autoScale(data) {
  const sample = [];
  let zeros = 0, finite = 0;
  for (let i = 0; i < data.length; i += 23) {
    const v = data[i];
    if (!Number.isFinite(v)) continue;
    finite++;
    if (v === 0) zeros++;
    else sample.push(v);
  }
  // Mostly-zero fields (precip, hail, ...) leave zero transparent and scale the rest.
  const clearZero = finite > 0 && zeros / finite > 0.5;
  if (!clearZero) for (let k = 0; k < zeros; k++) sample.push(0);
  if (!sample.length) return { lo: 0, hi: 1, clearZero };
  sample.sort((a, b) => a - b);
  const q = (p) => sample[Math.min(sample.length - 1, Math.floor(p * sample.length))];
  let lo = q(0.02), hi = q(0.98);
  if (hi <= lo) { lo = sample[0]; hi = sample[sample.length - 1]; }
  if (hi <= lo) hi = lo + 1;
  return { lo, hi, clearZero };
}

function fmt(v) {
  const a = Math.abs(v);
  if (a === 0) return "0";
  if (a >= 1000) return Math.round(v).toLocaleString();
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1).replace(/\.0$/, "");
  if (a >= 0.01) return v.toFixed(2).replace(/\.?0+$/, "");
  return v.toExponential(1);
}

// ---------- HRRR file access ----------
function pad2(n) { return String(n).padStart(2, "0"); }
function runPath(run) {
  return `hrrr.${run.date}/conus/hrrr.t${pad2(run.hour)}z.wrfsfcf${pad2(run.fhr)}.grib2`;
}

// "1 hour fcst" / "anl" -> instantaneous; "3-4 hour acc fcst" / "0-1 day max fcst" -> window.
function parseTime(t) {
  const m = /^(\d+)-(\d+) (hour|day) (acc|max|min|ave) fcst$/.exec(t);
  if (!m) return { kind: null, a: null, b: null };
  const mult = m[3] === "day" ? 24 : 1;
  return { kind: m[4], a: +m[1] * mult, b: +m[2] * mult };
}

const idxCache = new Map();
async function getIdx(run) {
  const url = `${BUCKET}/${runPath(run)}.idx`;
  if (idxCache.has(url)) return idxCache.get(url);
  const r = await fetch(url);
  if (!r.ok) throw new Error(`idx HTTP ${r.status}`);
  const raw = (await r.text()).trim().split("\n");
  const lines = raw.map((ln, k) => {
    const parts = ln.split(":");
    const next = raw[k + 1];
    return {
      offset: Number(parts[1]),
      end: next ? Number(next.split(":")[1]) - 1 : "",
      var: parts[3],
      level: parts[4],
      ...parseTime(parts[5]),
    };
  });
  idxCache.set(url, lines);
  return lines;
}

function windowMatches(line, win) {
  if (win === "1h") return line.b - line.a === 1;
  if (win === "run") return line.a === 0;
  return true;
}

// Curated fields match strictly; the full list falls back to any time window
// of the same field so animation keeps working when window labels shift.
function findLine(idx, src, strict) {
  const kind = src.kind || null;
  const candidates = idx.filter((ln) => ln.var === src.var && ln.level === src.level && ln.kind === kind);
  const exact = candidates.find((ln) => windowMatches(ln, src.win || "inst"));
  return exact || (strict ? null : candidates[0] || null);
}

const msgCache = new Map();
const MSG_CACHE_MAX = 30;
async function loadMessage(run, src, strict) {
  const key = `${run.date}/${run.hour}/${run.fhr}/${src.var}|${src.level}|${src.kind || ""}|${src.win || ""}`;
  if (msgCache.has(key)) {
    const v = msgCache.get(key);
    msgCache.delete(key); msgCache.set(key, v); // LRU refresh
    return v;
  }
  const idx = await getIdx(run);
  const line = findLine(idx, src, strict);
  if (!line) throw new Error(`not in F${pad2(run.fhr)}`);
  const r = await fetch(`${BUCKET}/${runPath(run)}`, { headers: { Range: `bytes=${line.offset}-${line.end}` } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const decoded = decodeGrib2(await r.arrayBuffer());
  msgCache.set(key, decoded);
  while (msgCache.size > MSG_CACHE_MAX) msgCache.delete(msgCache.keys().next().value);
  return decoded;
}

async function loadField(run, field) {
  if (field.components) {
    const [u, v] = await Promise.all(field.components.map((c) => loadMessage(run, c, true)));
    const data = new Float32Array(u.data.length);
    for (let i = 0; i < data.length; i++) data[i] = field.combine(u.data[i], v.data[i]);
    return { grid: u.grid, data };
  }
  const msg = await loadMessage(run, field.src, !field.auto);
  if (!field.convert) return msg;
  const data = new Float32Array(msg.data.length);
  for (let i = 0; i < data.length; i++) data[i] = field.convert(msg.data[i]);
  return { grid: msg.grid, data };
}

async function findRuns() {
  // Probe back from the current UTC hour for the newest run whose f01 exists.
  const now = new Date();
  const probes = [];
  for (let back = 0; back < 30; back++) {
    const t = new Date(now.getTime() - back * 3600e3);
    probes.push({
      date: `${t.getUTCFullYear()}${pad2(t.getUTCMonth() + 1)}${pad2(t.getUTCDate())}`,
      hour: t.getUTCHours(),
    });
  }
  for (let i = 0; i < probes.length; i++) {
    try {
      // Plain GET (not HEAD): the bucket's CORS policy only covers GET, and
      // the idx is ~10 KB. getIdx caches it, so the probe doubles as the fetch.
      await getIdx({ ...probes[i], fhr: 1 });
      return probes.slice(i); // newest first, back ~24 runs
    } catch (e) { /* keep probing */ }
  }
  throw new Error("No recent HRRR runs found");
}

  play: $("play"), prev: $("prev"), next: $("next"), status: $("status"), readout: $("readout"),
  legend: $("legend"), legendTitle: $("legendTitle"), validTime: $("validTime"),
};
const state = {

  run: null,       // {date, hour}
  fhr: 1,
  field: CURATED[0],
  allFields: [],   // every message in the run's file
  current: null,   // {grid, data} or {grid, data: null} when unavailable
  scale: null,     // {stops, vmin, vmax, clearZero, clampLow}

// ---------- map ----------
const map = L.map("map", {
  attributionControl: false,
  zoomControl: false,
  minZoom: 3,
  maxZoom: 11,
  zoomSnap: 1,
  worldCopyJump: false,
}).fitBounds([[24, -125], [50, -66]]);
L.control.zoom({ position: "topright" }).addTo(map);

// Minimal topographic basemap drawn from Terrarium elevation tiles:
// white land with stepped hillshade and contour lines, black sea.
const Topo = L.GridLayer.extend({
  createTile(coords, done) {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 256;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try { drawTopo(tile, img, coords.z, coords.y); done(null, tile); } catch (e) { done(e, tile); }
    };
    img.onerror = () => done(new Error("terrain tile"), tile);
    img.src = L.Util.template(TERRAIN, coords);
    return tile;
  },
});

function contourInterval(z) {
  if (z <= 4) return 1000;
  if (z <= 6) return 500;
  if (z <= 7) return 300;
  if (z <= 8) return 200;
  if (z <= 9) return 100;
  if (z <= 10) return 50;
  return 25;
}

function drawTopo(tile, img, z, ty) {
  const c = tile.getContext("2d", { willReadFrequently: true });
  c.drawImage(img, 0, 0);
  const src = c.getImageData(0, 0, 256, 256);
  const p = src.data;
  const N = 256;
  const elev = new Float32Array(N * N);
  for (let k = 0; k < N * N; k++) elev[k] = p[k * 4] * 256 + p[k * 4 + 1] + p[k * 4 + 2] / 256 - 32768;

  const latC = Math.atan(Math.sinh(Math.PI * (1 - (2 * (ty + 0.5)) / 2 ** z))) ;
  const mpp = (40075016.686 * Math.cos(latC)) / (256 * 2 ** z);
  const exag = 2 ** Math.max(0.5, (11 - z) * 0.55);
  const interval = contourInterval(z);
  // Sun from the north-west, 45° up.
  const az = (315 * Math.PI) / 180, alt = Math.PI / 4;
  const sx = Math.sin(az) * Math.cos(alt), sy = Math.cos(az) * Math.cos(alt), sz = Math.sin(alt);
  const out = c.createImageData(N, N);
  const o = out.data;
  const at = (x, y) => elev[Math.min(N - 1, Math.max(0, y)) * N + Math.min(N - 1, Math.max(0, x))];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const k = y * N + x, e = elev[k];
      let g;
      if (e <= 0) {
        g = 0;
      } else {
        const dzdx = ((at(x + 1, y) - at(x - 1, y)) / (2 * mpp)) * exag;
        const dzdy = ((at(x, y - 1) - at(x, y + 1)) / (2 * mpp)) * exag; // north-positive
        const len = Math.hypot(dzdx, dzdy, 1);
        const lit = Math.max(0, (-dzdx * sx - dzdy * sy + sz) / len);
        // Stepped shading keeps it graphic rather than photographic.
        g = 255 - Math.round((1 - lit / sz) * 5) * 24;
        g = Math.max(135, Math.min(255, g));
        const band = Math.floor(e / interval);
        if (band !== Math.floor(at(x + 1, y) / interval) || band !== Math.floor(at(x, y + 1) / interval)) {
          g = band % 5 === 0 ? 0 : Math.min(g - 40, 150);
        }
      }
      o[k * 4] = o[k * 4 + 1] = o[k * 4 + 2] = g;
      o[k * 4 + 3] = 255;
    }
  }
  c.putImageData(out, 0, 0);
}

new Topo({ maxNativeZoom: 12, keepBuffer: 2 }).addTo(map);

// HRRR overlay: each tile pixel looks up its grid cell, cached per tile so
// changing field or hour only recolours.
const tileIndex = new Map();
const TILE_INDEX_MAX = 120;
const liveTiles = new Set();
function tileGridIndex(coords) {
  const key = `${coords.z}/${coords.x}/${coords.y}`;
  if (tileIndex.has(key)) return tileIndex.get(key);
  const { nx, ny } = state.current.grid;
  const idx = new Int32Array(256 * 256);
  const world = 256 * 2 ** coords.z;
  for (let y = 0; y < 256; y++) {
    const py = coords.y * 256 + y + 0.5;
    const lat = (Math.atan(Math.sinh(Math.PI * (1 - (2 * py) / world))) * 180) / Math.PI;
    for (let x = 0; x < 256; x++) {
      const lon = ((coords.x * 256 + x + 0.5) / world) * 360 - 180;
      const [gi, gj] = state.proj.toGrid(lon, lat);
      const i = Math.round(gi), j = Math.round(gj);
      idx[y * 256 + x] = i >= 0 && i < nx && j >= 0 && j < ny ? j * nx + i : -1;
    }
  }
  tileIndex.set(key, idx);
  while (tileIndex.size > TILE_INDEX_MAX) tileIndex.delete(tileIndex.keys().next().value);
  return idx;
}

function paintDataTile(tile) {
  const c = tile.getContext("2d");
  c.clearRect(0, 0, 256, 256);
  if (!state.rgba || !state.proj) return;
  const idx = tileGridIndex(tile._coords);
  const img = c.createImageData(256, 256);
  const o = img.data, src = state.rgba;
  for (let k = 0; k < idx.length; k++) {
    const g = idx[k];
    if (g < 0) continue;
    const s = g * 4;
    o[k * 4] = src[s]; o[k * 4 + 1] = src[s + 1]; o[k * 4 + 2] = src[s + 2]; o[k * 4 + 3] = src[s + 3];
  }
  c.putImageData(img, 0, 0);
}

const DataLayer = L.GridLayer.extend({
  createTile(coords) {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 256;
    tile._coords = coords;
    liveTiles.add(tile);
    paintDataTile(tile);
    return tile;
  },
});
const dataLayer = new DataLayer({ opacity: 0.78, zIndex: 2 }).addTo(map);
dataLayer.on("tileunload", (e) => liveTiles.delete(e.tile));
function repaintData() { for (const t of liveTiles) paintDataTile(t); }

// US state outlines above the data.
map.createPane("lines").style.zIndex = 450;
(function addStateLines() {
  const lines = [];
  for (const enc of STATE_LINES_ENC) {
    const pts = [];
    let x = 0, y = 0;
    for (let k = 0; k < enc.length; k += 2) {
      x += enc[k]; y += enc[k + 1];
      pts.push([y / 100, x / 100]);
    }
    lines.push(pts);
  }
  L.polyline(lines, { pane: "lines", color: "#000", weight: 1, opacity: 1, interactive: false, smoothFactor: 0.5 }).addTo(map);
})();

function setDomainBounds() {
  const { nx, ny } = state.current.grid;
  const pts = [];
  for (const [i, j] of [[0, 0], [nx - 1, 0], [0, ny - 1], [nx - 1, ny - 1], [nx / 2, 0], [nx / 2, ny - 1], [0, ny / 2], [nx - 1, ny / 2]]) {
    const [lon, lat] = state.proj.toLonLat(i, j);
    pts.push([lat, lon]);
  }
  map.setMaxBounds(L.latLngBounds(pts).pad(0.05));
}

// ---------- rendering ----------
function maxFhr(run) { return run.hour % 6 === 0 ? 48 : 18; }

function curatedScale(f) {
  return { stops: f.stops, vmin: f.stops[0][0], vmax: f.stops[f.stops.length - 1][0], clearZero: false, clampLow: false };
}

function computeScale() {
  const f = state.field;
  if (!f.auto) {
    state.scale = curatedScale(f);
    return;
  }
  const { lo, hi, clearZero } = autoScale(state.current.data);
  state.scale = { stops: VIRIDIS.map(([t, r, g, b]) => [lo + t * (hi - lo), r, g, b, 255]), vmin: lo, vmax: hi, clearZero, clampLow: true };
}

function colorGrid() {
  const { data } = state.current;
  if (!data) { state.rgba = null; return; }
  const { stops, vmin, vmax, clearZero, clampLow } = state.scale;
  const LUTN = 1024;
  const lut = makeColorLUT(stops, vmin, vmax, LUTN);
  const k = (LUTN - 1) / (vmax - vmin);
  const out = new Uint8ClampedArray(data.length * 4);
  for (let i = 0; i < data.length; i++) {
    const v = data[i];
    if (!Number.isFinite(v) || (clearZero && v === 0) || (v < vmin && !clampLow)) continue;
    let n = ((v - vmin) * k) | 0;
    if (n < 0) n = 0; else if (n >= LUTN) n = LUTN - 1;
    out[i * 4] = lut[n * 4]; out[i * 4 + 1] = lut[n * 4 + 1]; out[i * 4 + 2] = lut[n * 4 + 2]; out[i * 4 + 3] = lut[n * 4 + 3];
  }
  state.rgba = out;
}

function pickTicks(values, count) {
  if (values.length <= count) return values;
  const out = [];
  for (let n = 0; n < count; n++) out.push(values[Math.round((n * (values.length - 1)) / (count - 1))]);
  return out;
}

let legendKey = "";
function drawLegend() {
  const f = state.field;
  ui.legendTitle.textContent = `${f.label}${f.units ? ` · ${f.units}` : ""}`;
  const c = ui.legend;
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth || 300, h = 26;
  // Resizing a canvas clears it, so only redraw when something visible changed.
  const sc = state.scale;
  const key = [f.id, w, dpr, sc ? sc.vmin.toPrecision(3) : "", sc ? sc.vmax.toPrecision(3) : ""].join("|");
  if (key === legendKey) return;
  legendKey = key;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!state.scale) return;
  const { stops, vmin, vmax } = state.scale;
  const barH = 10;
  // Hand-tuned colormaps have uneven steps, so give each step equal width.
  const even = !f.auto;
  const segs = stops.length - 1;
  const xOf = (v) => even ? (Math.max(0, stops.findIndex((s) => s[0] === v)) / segs) * w : ((v - vmin) / (vmax - vmin)) * w;
  for (let x = 0; x < w; x++) {
    const t = x / Math.max(1, w - 1);
    let s, u;
    if (even) {
      s = Math.min(segs - 1, Math.floor(t * segs)); u = t * segs - s;
    } else {
      const v = vmin + t * (vmax - vmin);
      s = 0;
      while (s < segs - 1 && v > stops[s + 1][0]) s++;
      u = Math.min(1, Math.max(0, (v - stops[s][0]) / (stops[s + 1][0] - stops[s][0])));
    }
    const a = stops[s], b = stops[s + 1];
    const col = [1, 2, 3, 4].map((ch) => a[ch] + u * (b[ch] - a[ch]));
    // Composite over white so transparent ends still read.
    const al = col[3] / 255;
    g.fillStyle = `rgb(${col.slice(0, 3).map((v) => Math.round(v * al + 255 * (1 - al))).join(",")})`;
    g.fillRect(x, 0, 1, barH);
  }
  g.fillStyle = "#000";
  g.fillRect(0, barH, w, 2);
  g.font = `700 10px ui-monospace, Menlo, monospace`;
  const ticks = f.auto
    ? [0, 0.25, 0.5, 0.75, 1].map((t) => vmin + t * (vmax - vmin))
    : pickTicks(stops.map((s) => s[0]), Math.max(3, Math.floor(w / 50)));
  ticks.forEach((v, n) => {
    const x = xOf(v);
    g.textAlign = n === 0 ? "left" : n === ticks.length - 1 ? "right" : "center";
    g.fillText(fmt(v), x, barH + 13);
  });
}

function setStatus(msg) { ui.status.textContent = msg; }

function validTimeText() {
  const { date, hour } = state.run;
  const runMs = Date.UTC(+date.slice(0, 4), +date.slice(4, 6) - 1, +date.slice(6, 8), hour);
  const valid = new Date(runMs + state.fhr * 3600e3);
  return valid.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric" });
}

async function refresh() {
  const seq = ++state.loadSeq;
  const run = { ...state.run, fhr: state.fhr };
  const field = state.field;
  ui.validTime.textContent = validTimeText();
  setStatus("Loading");
  try {
    const decoded = await loadField(run, field);
    if (seq !== state.loadSeq) return;
    state.current = decoded;
    if (!state.proj) {
      state.proj = makeProjection(decoded.grid);
      setDomainBounds();
    }
    computeScale();
    colorGrid();
    repaintData();
    drawLegend();
    setStatus("");
    prefetchNext();
  } catch (e) {
    if (seq !== state.loadSeq) return;
    if (state.current) state.current = { grid: state.current.grid, data: null };
    state.rgba = null;
    repaintData();
    drawLegend();
    setStatus(`No data: ${e.message}`);
  }
}

function prefetchNext() {
  const next = state.fhr + 1;
  if (next > maxFhr(state.run)) return;
  loadField({ ...state.run, fhr: next }, state.field).catch(() => {});
}

// ---------- readout ----------
function readAt(latlng) {
  if (!state.current?.data || !state.proj) return null;
  const { nx, ny } = state.current.grid;
  const [gi, gj] = state.proj.toGrid(latlng.lng, latlng.lat);
  const i = Math.round(gi), j = Math.round(gj);
  if (i < 0 || i >= nx || j < 0 || j >= ny) return null;
  return state.current.data[j * nx + i];
}
function showReadout(latlng) {
  const v = readAt(latlng);
  const pos = `${Math.abs(latlng.lat).toFixed(1)}${latlng.lat >= 0 ? "N" : "S"} ${Math.abs(latlng.lng).toFixed(1)}${latlng.lng >= 0 ? "E" : "W"}`;
  ui.readout.textContent = Number.isFinite(v) ? `${fmt(v)} ${state.field.units} · ${pos}`.replace("  ", " ") : pos;
}
map.on("mousemove", (e) => showReadout(e.latlng));
map.on("click", (e) => showReadout(e.latlng));
map.on("mouseout", () => { ui.readout.innerHTML = "&nbsp;"; });

// ---------- field picker ----------
function buildAllFields(idx) {
  const seen = new Set();
  const out = [];
  for (const ln of idx) {
    const id = `${ln.var}|${ln.level}|${ln.kind || ""}`;
    if (seen.has(id)) continue;
    seen.add(id);
    const win = ln.kind ? (ln.b - ln.a === 1 ? "1h" : "run") : "inst";
    const [name, units] = NAMES[ln.var] || [ln.var.replace(/^var /, ""), ""];
    const when = ln.kind ? `, ${win === "1h" ? "1-hr" : "run"} ${KIND_WORDS[ln.kind]}` : "";
    out.push({
      id: "all:" + id,
      auto: true,
      label: `${name}, ${ln.level}${when}`,
      units,
      group: groupOf(ln.var, ln.level),
      src: { var: ln.var, level: ln.level, kind: ln.kind, win },
    });
  }
  return out;
}

for (const f of CURATED) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cell";
  b.textContent = f.short;
  b.title = f.label;
  b.dataset.field = f.id;
  b.addEventListener("click", () => setField(f));
  ui.fields.insertBefore(b, ui.more);
}

function fillMore() {
  ui.more.innerHTML = "";
  ui.more.add(new Option(`All ${state.allFields.length || ""} fields ▾`.replace("  ", " "), ""));
  const groups = new Map();
  for (const f of state.allFields) {
    if (!groups.has(f.group)) groups.set(f.group, []);
    groups.get(f.group).push(f);
  }
  for (const [name] of GROUPS) {
    if (!groups.has(name)) continue;
    const og = document.createElement("optgroup");
    og.label = name;
    for (const f of groups.get(name)) og.appendChild(new Option(f.label, f.id));
    ui.more.appendChild(og);
  }
  syncFieldButtons();
}

function syncFieldButtons() {
  for (const b of ui.fields.querySelectorAll("button[data-field]")) {
    const on = b.dataset.field === state.field.id;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  }
  const fromMore = !!state.field.auto;
  ui.more.classList.toggle("on", fromMore);
  ui.more.value = fromMore ? state.field.id : "";
}

function setField(field) {
  state.field = field;
  syncFieldButtons();
  // Curated legends are known up front; auto-scaled ones wait for the data.
  if (!field.auto) {
    state.scale = curatedScale(field);
    drawLegend();
  }
  refresh();
}
ui.more.addEventListener("change", () => {
  const f = state.allFields.find((x) => x.id === ui.more.value);
  if (f) setField(f); else syncFieldButtons();
});

// ---------- run + time ----------
async function loadRunFieldList() {
  try {
    state.allFields = buildAllFields(await getIdx({ ...state.run, fhr: 1 }));
  } catch (e) {
    state.allFields = [];
  }
  fillMore();
}

function setRunOptions() {
  ui.run.innerHTML = "";
  state.runs.forEach((r, n) => {
    const label = `Run ${r.date.slice(4, 6)}/${r.date.slice(6, 8)} ${pad2(r.hour)}Z${n === 0 ? " latest" : ""} ▾`;
    ui.run.add(new Option(label, `${r.date}:${r.hour}`));
  });
}
ui.run.addEventListener("change", async () => {
  const [date, hour] = ui.run.value.split(":");
  state.run = { date, hour: +hour };
  clampFhr();
  await loadRunFieldList();
  refresh();
});

function setFhr(n) {
  state.fhr = n;
  ui.fhr.value = n;
  ui.fhrLabel.textContent = "F" + pad2(n);
}
function clampFhr() {
  ui.fhr.max = maxFhr(state.run);
  setFhr(Math.min(state.fhr, maxFhr(state.run)));
}
ui.fhr.addEventListener("input", () => { setFhr(+ui.fhr.value); refresh(); });
function stepFhr(d) {
  const mx = maxFhr(state.run);
  setFhr((state.fhr + d + mx + 1) % (mx + 1));
  refresh();
}
ui.prev.addEventListener("click", () => { stopPlay(); stepFhr(-1); });
ui.next.addEventListener("click", () => { stopPlay(); stepFhr(1); });
document.addEventListener("keydown", (e) => {
  if (e.target.closest("select, input")) return;
  if (e.key === "ArrowLeft" && e.shiftKey) { stopPlay(); stepFhr(-1); }
  if (e.key === "ArrowRight" && e.shiftKey) { stopPlay(); stepFhr(1); }
});

function stopPlay() {
  state.playing = false;
  clearTimeout(state.playTimer);
  ui.play.classList.remove("on");
  ui.play.textContent = "Play";
}
ui.play.addEventListener("click", () => {
  if (state.playing) { stopPlay(); return; }
  state.playing = true;
  ui.play.classList.add("on");
  ui.play.textContent = "Stop";
  const step = async () => {
    if (!state.playing) return;
    setFhr(state.fhr >= maxFhr(state.run) ? 0 : state.fhr + 1);
    await refresh();
    state.playTimer = setTimeout(step, 450);
  };
  step();
});

window.addEventListener("resize", drawLegend);

// ---------- boot ----------
(async function boot() {
  syncFieldButtons();
  state.scale = curatedScale(state.field);
  drawLegend();
  setStatus("Finding latest run");
  try {
    state.runs = await findRuns();
  } catch (e) {
    setStatus(e.message);
    return;
  }
  state.run = state.runs[0];
  setRunOptions();
  clampFhr();
  await loadRunFieldList();
  refresh();
})();
</script>
