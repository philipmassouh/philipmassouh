<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philip Massouh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Mono", "Droid Sans Mono", "Source Code Pro", monospace;
      font-size: 16px;
      line-height: 1.6;
      padding: 60px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .intro {
      margin-bottom: 40px;
    }

    .intro h1 {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 16px;
    }

    .intro p {
      color: #ccc;
    }

    .section {
      margin-bottom: 32px;
    }

    .section h2 {
      font-size: 14px;
      font-weight: normal;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .links {
      list-style: none;
    }

    .links li {
      margin-bottom: 8px;
    }

    .links a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .links a:hover {
      border-color: #fff;
    }

    .light-mode-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: none;
      color: #666;
      border: none;
      padding: 8px;
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .light-mode-btn:hover {
      color: #fff;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: #111;
      border: 1px solid #333;
      padding: 40px 60px;
      text-align: center;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="intro">
      <h1>Philip Massouh</h1>
      <p>Senior Software Engineer at <a href="https://www.rainmaker.com/">Rainmaker Technology Corporation</a>.</p>
    </div>

    <div class="section">
      <h2>Links</h2>
      <ul class="links">
        <li><a href="https://twitter.com/philipmassouh">Twitter</a></li>
        <li><a href="https://github.com/philipmassouh">GitHub</a></li>
        <li><a href="https://instagram.com/philipmassouh">Instagram</a></li>
        <li><a href="https://linkedin.com/in/philipmassouh">LinkedIn</a></li>
      </ul>
    </div>

    <div class="section">
      <h2>I'm not a foodie</h2>
      <ul class="links">
        <li><a href="https://philipmassouh.com/food">Food Map</a></li>
      </ul>
    </div>
  </div>

  <button class="light-mode-btn" onclick="document.getElementById('modal').classList.add('show')">☀</button>

  <div id="modal" class="modal-overlay" onclick="this.classList.remove('show')">
    <div class="modal">no</div>
  </div>
</body>
</html>
