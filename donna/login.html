<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aunt Donna's Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #14110e;
      color: #eee6d6;
      font-family: "Pixelify Sans", monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    main { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 32px; font-weight: 600; margin-bottom: 18px; }

    .stage { position: relative; border: 3px solid #2a241d; margin-bottom: 20px; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }

    .bubble {
      position: absolute;
      left: 6%;
      top: 10%;
      max-width: 48%;
      padding: 6px 10px 7px;
      background: #ffe3ec;
      color: #1d1a16;
      border: 2px solid #1d1a16;
      font-size: 18px;
      line-height: 1.2;
      text-align: left;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
    }
    .bubble::after {
      content: "";
      position: absolute;
      right: -10px;
      bottom: 10px;
      width: 8px;
      height: 8px;
      background: #ffe3ec;
      border: 2px solid #1d1a16;
      border-left: none;
      border-bottom: none;
    }

    form { display: flex; gap: 8px; }
    input, button {
      font: inherit;
      font-size: 18px;
      background: #1d1914;
      color: #eee6d6;
      border: 2px solid #4a4136;
      padding: 10px 12px;
    }
    input { flex: 1; min-width: 0; }
    button { cursor: pointer; }
    input:focus, button:focus-visible, button:hover { outline: none; border-color: #eee6d6; }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <main>
    <h1>Aunt Donna's Wall</h1>
    <div class="stage">
      <canvas id="door" width="120" height="90" aria-label="Donna standing in her doorway"></canvas>
      <div class="bubble" id="bubble">Who's there?</div>
    </div>
    <form id="login">
      <input id="pw" type="password" autocomplete="current-password" placeholder="password" aria-label="Password" autofocus>
      <button type="submit">Knock</button>
    </form>
  </main>

<script>
'use strict';

// Same Donna as the game.
const DONNA = [
  '....aAAAAAa.....', '...aAAAAAAAAa...', '..AAAaAAAAAAAA..', '..AAAASSSSSAAA..',
  '..AASSSSSSSSAA..', '..AASEESSEESAA..', '..AASSSSSSSSAA..', '..AASSSsSSSSAA..',
  '.OAASSSLLSSSAAO.', 'O.OAAsSSSSsAAO.O', '.O..AASSSSAA..O.', '......SSSS......',
  '...KKKKKKKKKK...', '..KKKKKKKKKKKK..', '..KKKkKKKKkKKK..', '..KKKKKKKKKKKK..',
  '..KKKkKKKKkKKK..', '..KKKKKKKKKKKK..', '...KKKKKKKKKK...', '...KKKKKKKKKK...',
  '...KkKKKKKKkK...', '...PPPPPPPPP....', '...PPPPPPPPP....', '...PPPP.PPPP....',
  '...PPPP.PPPP....', '...PPP...PPP....', '...PPP...PPP....', '...PPP...PPP....',
  '..FFFF...FFFF...',
];
const PAL = {
  a: '#b8693a', A: '#8b4a26', S: '#e9bba0', s: '#d09b80', E: '#3a2a22', L: '#b05a52',
  O: '#d4ad52', K: '#1a1a1d', k: '#2e2e33', P: '#26262b', F: '#111111',
};

const ctx = document.getElementById('door').getContext('2d');
ctx.imageSmoothingEnabled = false;
const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

function draw(mood) {
  px(0, 0, 120, 90, '#e6dcc0');
  const urn = ['..UU..', '.UUUU.', 'UUUUUU', '.UUUU.', '..UU..', '.UUUU.', 'UUUUUU', 'UUUUUU', '.UUUU.', '..UU..', '.UUUU.'];
  for (let y = 4, row = 0; y < 70; y += 22, row++) {
    for (let x = (row % 2) * 16 + 4; x < 120; x += 32) {
      urn.forEach((r, j) => { for (let i = 0; i < 6; i++) if (r[i] === 'U') px(x + i, y + j, 1, 1, '#c4b48c'); });
    }
  }
  px(0, 80, 120, 10, '#6e4a2c');
  px(0, 84, 120, 1, '#5c3d24');
  px(0, 75, 120, 5, '#f2ecdc');
  // Doorway.
  px(66, 10, 44, 70, '#f2ecdc');
  px(70, 14, 36, 66, '#2a2119');
  px(70, 14, 36, 3, '#3a2e22');
  // Donna, 2x.
  const left = 72, top = 80 - 58;
  DONNA.forEach((row, y) => {
    for (let i = 0; i < 16; i++) if (PAL[row[i]]) px(left + i * 2, top + y * 2, 2, 2, PAL[row[i]]);
  });
  if (mood === 'happy') {
    px(left + 13, top + 16, 6, 2, PAL.L);
    px(left + 11, top + 14, 2, 2, PAL.L); px(left + 19, top + 14, 2, 2, PAL.L);
    px(left - 4, top + 12, 4, 14, PAL.K); px(left - 5, top + 9, 5, 5, PAL.S);
  } else if (mood === 'cross') {
    px(left + 9, top + 9, 4, 1, PAL.A); px(left + 19, top + 9, 4, 1, PAL.A);
    px(left + 4, top + 33, 24, 6, PAL.K);
    px(left + 6, top + 33, 4, 4, PAL.S); px(left + 22, top + 35, 4, 4, PAL.S);
  } else {
    px(left + 4, top + 33, 24, 6, PAL.K);
    px(left + 6, top + 33, 4, 4, PAL.S); px(left + 22, top + 35, 4, 4, PAL.S);
  }
}

const COOKIE = 'donna_key';
const secure = location.protocol === 'https:' ? '; Secure' : '';
const bubble = document.getElementById('bubble');
const form = document.getElementById('login');

// Caddy shows this page instead of the game when the cookie is missing or
// wrong, so a cookie that's already set here means the last guess was wrong.
const tried = document.cookie.split('; ').some(c => c.startsWith(COOKIE + '='));
if (tried) {
  document.cookie = `${COOKIE}=; Path=/donna; Max-Age=0${secure}`;
  bubble.textContent = "That's not it, honey.";
  draw('cross');
} else {
  draw('neutral');
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  if (!pw) {
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    return;
  }
  document.cookie = `${COOKIE}=${encodeURIComponent(pw)}; Path=/donna; Max-Age=31536000; SameSite=Lax${secure}`;
  bubble.textContent = 'Come in, come in!';
  draw('happy');
  setTimeout(() => location.reload(), 500);
});
</script>
</body>
</html>
